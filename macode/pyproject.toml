[project]
name = "macode"
version = "0.1.0"
description = "macode:多智能体 coding agent(架构师→工程师→测试执行→评审),基于 crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.14,<2.0.0",
    # crewai 的 anthropic provider 需要 anthropic SDK(不在 crewai[tools] 默认依赖里)
    "anthropic>=0.40",
    # tester Agent 运行 pytest 验证代码
    "pytest>=8",
]

[project.scripts]
macode = "macode.main:run"
run_crew = "macode.main:run"
train = "macode.main:train"
replay = "macode.main:replay"
test = "macode.main:test"
run_with_trigger = "macode.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "8c14b4e2-a351-42b4-8319-744a8534355d"
