name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装项目及依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e multi_agent_crew/

      # CI 环境没有本地 LLM 代理,也不发真实 LLM 请求:
      # 只做 导入 + 配置 + 离线构建 的冒烟检查(memory/knowledge 关闭以保持离线、快速)。
      - name: 冒烟检查
        env:
          ANTHROPIC_BASE_URL: "http://localhost:0"   # 占位,构建期不发请求
          ANTHROPIC_AUTH_TOKEN: "ci-placeholder"
          CREW_MEMORY: "0"
          CREW_KNOWLEDGE: "0"
        run: |
          python - <<'PY'
          import crewai  # noqa: F401
          import crewai_tools  # noqa: F401
          from crewai import TaskOutput
          from multi_agent_crew.crew import MultiAgentCrew
          from multi_agent_crew.flow import CodingFlow
          from multi_agent_crew.output_models import ImplementationPlan
          from multi_agent_crew.guardrails import code_solution_guardrail, json_output_guardrail
          from multi_agent_crew.tools import (
              CodeSearchTool, ListDirTool, PythonRunTool,
              PythonSyntaxCheckTool, PytestRunTool, ShellCommandTool,
          )
          print("[smoke] imports OK")

          # 离线构建 crew(不 kickoff、不联网):4 个 Agent / 4 个 Task
          crew = MultiAgentCrew().crew()
          assert len(crew.agents) == 4 and len(crew.tasks) == 4
          print("[smoke] crew 构建 OK | process:", crew.process.value)

          # 校验工具挂载(读/写/搜索/执行/语法检查 都应在)
          flat = {t.name for a in crew.agents for t in (a.tools or [])}
          for need in ["python_syntax_check", "shell_command", "python_run", "pytest_run", "code_search", "list_dir"]:
              assert need in flat, f"工具未挂载: {need}"
          print("[smoke] 工具挂载 OK:", sorted(flat))

          # guardrail 逻辑(纯本地)
          g = json_output_guardrail(ImplementationPlan)
          ok, _ = g(TaskOutput(
              description="",
              raw='{"goal":"g","files":[{"path":"a.py","purpose":"p","key_points":["k"]}]}',
              agent="", expected_output="",
          ))
          assert ok, "json_output_guardrail 应通过合法 JSON"
          cg = code_solution_guardrail()
          ok2, _ = cg(TaskOutput(description="", raw="```python\n" + "x=1\n"*80 + "```", agent="", expected_output=""))
          assert ok2, "code_solution_guardrail 应通过含代码块的产出"
          print("[smoke] guardrail 校验 OK")

          # 执行/检查工具(纯本地,不依赖 LLM)
          assert "语法正确" in PythonSyntaxCheckTool()._run("x = 1\n")
          assert "语法错误" in PythonSyntaxCheckTool()._run("def broken(:\n")
          assert "已拒绝执行" in ShellCommandTool()._run("rm -rf /")  # 危险命令应被拦截
          print("[smoke] 执行/检查工具 OK")

          # Flow 结构存在
          assert hasattr(CodingFlow, "kickoff")
          print("[smoke] Flow 结构 OK:", CodingFlow.__name__)

          # 动态工作流结构
          from multi_agent_crew.dynamic_flow import DynamicCodingFlow, _tier_name
          assert _tier_name("retry.py") == "strong" and _tier_name("test_x.py") == "fast"
          print("[smoke] 动态工作流 OK:", DynamicCodingFlow.__name__)
          print("[smoke] 全部通过 ✅")
          PY

      # npm CLI 冒烟:help 应在未准备 Python 环境前就能正常输出并退出 0
      - name: npm CLI 冒烟
        run: |
          node --version
          node bin/cli.js --help | head -5
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.macode) process.exit(1); console.log('package.json bin OK:', Object.keys(p.bin))"
