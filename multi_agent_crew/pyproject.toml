[project]
name = "multi_agent_crew"
version = "0.1.0"
description = "multi_agent_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.14,<2.0.0",
    # crewai 的 anthropic provider 需要 anthropic SDK(不在 crewai[tools] 默认依赖里)
    "anthropic>=0.40",
    # tester Agent 运行 pytest 验证代码
    "pytest>=8",
]

[project.scripts]
multi_agent_crew = "multi_agent_crew.main:run"
run_crew = "multi_agent_crew.main:run"
train = "multi_agent_crew.main:train"
replay = "multi_agent_crew.main:replay"
test = "multi_agent_crew.main:test"
run_with_trigger = "multi_agent_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "8c14b4e2-a351-42b4-8319-744a8534355d"
