plan_task:
  description: >
    理解以下编码需求,并给出实现方案:
    {requirement}
    你可以先用目录浏览工具(list_dir)和代码搜索工具(code_search)了解项目现状,
    用文件读取工具查看 knowledge/coding_preference.txt 了解编码偏好,
    也会自动检索内置的编码规范。把需求拆解为若干文件/模块,明确每个文件的职责。
    最终只输出一个 JSON 对象,不要任何额外解释或 markdown 围栏。
  expected_output: >
    一个纯 JSON 对象(不要 ``` 围栏、不要多余文字),结构为:
    {"goal": "<一句话目标>", "files": [{"path": "<相对 generated/ 的文件路径>",
    "purpose": "<该文件职责>", "key_points": ["<关键实现点>", ...]}, ...]}
  agent: architect

code_task:
  description: >
    严格根据上一步的实现方案,用文件写入工具(file_writer_tool)把每个文件的代码
    写入 generated/ 目录(directory 用 "generated")。代码要完整、可运行、符合
    编码规范,并附带必要的单元测试。逐个文件写入,不要遗漏方案中的任何文件。
  expected_output: >
    一段简要说明:列出了实际写入 generated/ 的所有文件路径及每个文件的要点。
  agent: coder

test_task:
  description: >
    对上一步写入 generated/ 的代码做真实验证:
    1) 用 pytest_run 运行 generated/tests 下的测试;
    2) 如有可直接运行的入口,用 python_run 执行确认能跑;
    3) 必要时用 shell_command 安装缺失依赖(尽量用标准库,避免额外依赖)。
    如实报告:测试通过/失败数、失败用例与原因、运行输出。不要修改代码,只做验证。
  expected_output: >
    一份验证报告:pytest 通过/失败统计、失败用例与根因(若有)、代码运行结果,
    以及对「代码是否正确可运行」的明确结论。
  agent: tester

review_task:
  description: >
    结合上一步的真实测试结果审查 generated/ 中的代码:参考 pytest 结论,
    用 python_syntax_check 复核每个 Python 文件语法,审查逻辑正确性、边界处理与
    可维护性,修正发现的问题(直接给出修正后的完整代码)。
    把最终代码(含测试)、测试结论与评审说明整理后写入 solution.md。
  expected_output: >
    一份 markdown:包含每个文件的最终代码(用 ```python 代码块)、pytest 测试结论、
    以及一段简要的评审说明(发现了什么问题、改了什么、为什么)。
  agent: reviewer
